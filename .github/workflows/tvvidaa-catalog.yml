name: TVVIDAA catalog validation

on:
  push:
    branches:
      - fix/tvvidaa-catalog-production
  pull_request:
    branches:
      - hostinger-vps
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find server tools webos/fidelity/api webos/fidelity/js -type f \( -name '*.js' -o -name '*.cjs' \) -print0)

      - name: Unit and integration tests
        env:
          MEDIA_TOKEN_SECRET: test-ci-media-secret-32-bytes-minimum-0123456789
          PUBLIC_BASE_URL: https://tv.example.test
        run: node --test server/*.test.cjs server/providers/*.test.cjs tools/*.test.cjs

      - name: Protected player paths remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hostinger-vps --depth=1 || true
          if git rev-parse --verify origin/hostinger-vps >/dev/null 2>&1; then
            changed=$(git diff --name-only origin/hostinger-vps...HEAD -- webos/fidelity/js/app.js webos/services/)
            if [ -n "$changed" ]; then
              echo "Protected playback files changed unexpectedly:"; echo "$changed"; exit 1
            fi
          fi

      - name: Docker image build
        run: docker build -f deploy/hostinger/Dockerfile -t tvvidaa-catalog:ci .

      - name: Docker Compose configuration
        env:
          PUBLIC_BASE_URL: https://tv.example.test
          MEDIA_TOKEN_SECRET: test-ci-media-secret-32-bytes-minimum-0123456789
          XUPER_SESSION_SECRET: test-ci-session-secret-32-bytes-minimum-0123456789
          XUPER_WEB_PASSWORD: example-test-password-not-used-in-production
        run: docker compose -f deploy/hostinger/compose.yaml config --quiet
