name: TVVIDAA web-only validation

on:
  push:
    branches:
      - hostinger-vps
      - refactor/vidaa-cleanup
  pull_request:
    branches:
      - hostinger-vps
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find server web -type f \( -name '*.js' -o -name '*.cjs' \) -print0)
      - name: No obsolete webOS/Xuper components in active tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -d webos
          test ! -d tools
          test ! -e INSTALAR-XUPERTV.bat
          if grep -REn "require\(['\"][^'\"]*webos|PalmServiceBridge|luna://" server/api server/providers server/services server/http-server.cjs web/js; then
            echo 'Unexpected obsolete runtime dependency detected'
            exit 1
          fi
      - name: Node unit and API integration tests
        env:
          MEDIA_TOKEN_SECRET: test-ci-media-secret-32-bytes-minimum-0123456789
          PUBLIC_BASE_URL: https://tv.example.test
        run: node --test server/*.test.cjs server/providers/*.test.cjs
      - name: Build Docker image
        run: docker build -f deploy/hostinger/Dockerfile -t tvvidaa-web:ci .
      - name: Verify Compose configuration
        env:
          PUBLIC_BASE_URL: https://tv.example.test
          MEDIA_TOKEN_SECRET: test-ci-media-secret-32-bytes-minimum-0123456789
          VIDAA_SESSION_SECRET: test-ci-session-secret-32-bytes-minimum-0123456789
          VIDAA_WEB_PASSWORD: test-passphrase-at-least-fourteen-characters
        run: docker compose -f deploy/hostinger/compose.yaml config --quiet
      - name: Docker HTTP, frontend and session smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name tvvidaa-cleanup-smoke -p 127.0.0.1:38590:3000 \
            -e PUBLIC_BASE_URL=https://tv.example.test \
            -e MEDIA_TOKEN_SECRET=test-ci-media-secret-32-bytes-minimum-0123456789 \
            -e VIDAA_SESSION_SECRET=test-ci-session-secret-32-bytes-minimum-0123456789 \
            -e VIDAA_WEB_PASSWORD=test-passphrase-at-least-fourteen-characters tvvidaa-web:ci
          trap 'docker rm -f tvvidaa-cleanup-smoke >/dev/null 2>&1 || true' EXIT
          for i in {1..25}; do
            if curl --fail --silent --show-error http://127.0.0.1:38590/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:38590/healthz | grep '"ready":true'
          curl -fsS -H 'Host: tv.example.test' http://127.0.0.1:38590/ | grep '<title>TVVIDAA'
          curl -fsS -H 'Host: tv.example.test' http://127.0.0.1:38590/js/app.js | grep 'standalone web'
          curl -fsS -H 'Host: tv.example.test' http://127.0.0.1:38590/css/app.css | grep 'standalone responsive'
          curl -fsS -H 'Host: tv.example.test' http://127.0.0.1:38590/api/session | grep '"authenticated":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: tv.example.test' \
            -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:38590/api/ping)" = "401"
          # The login cookie is Secure; curl correctly will not send it via the
          # local HTTP loopback URL. Carry it explicitly only for this isolated test.
          curl -fsS -D /tmp/vidaa-test-headers -o /tmp/vidaa-test-login \
            -H 'Host: tv.example.test' -H 'Content-Type: application/json' \
            -d '{"password":"test-passphrase-at-least-fourteen-characters"}' \
            http://127.0.0.1:38590/api/login
          grep '"authenticated":true' /tmp/vidaa-test-login
          cookie=$(grep -i '^set-cookie:' /tmp/vidaa-test-headers | cut -d' ' -f2 | cut -d';' -f1 | tr -d '\r')
          test -n "$cookie"
          curl -fsS -H "Cookie: $cookie" -H 'Host: tv.example.test' \
            -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:38590/api/ping | grep '"service":"TVVIDAA-web"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: tv.example.test' \
            http://127.0.0.1:38590/js/access.js)" = "404"
