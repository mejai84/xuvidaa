# Deploy this as its own Docker Compose application in Dokploy.
name: xuvidaa-tv
services:
  xuper:
    build:
      context: ../..
      dockerfile: deploy/hostinger/Dockerfile
    expose:
      - '3000'
    networks:
      - xuvidaa-tv-private
    labels:
      - traefik.enable=true
      - traefik.docker.network=xuvidaa-tv-private
      - traefik.http.routers.xuvidaa-tv.rule=Host(`tv.rfcsas.com`)
      - traefik.http.routers.xuvidaa-tv.entrypoints=websecure
      - traefik.http.routers.xuvidaa-tv.tls=true
      - traefik.http.routers.xuvidaa-tv.tls.certresolver=letsencrypt
      - traefik.http.services.xuvidaa-tv.loadbalancer.server.port=3000
    environment:
      NODE_ENV: production
      BIND_HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in Dokploy}
      MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET:?Set MEDIA_TOKEN_SECRET in Dokploy}
      # Passwordless mode is opt-in; otherwise the existing web password stays active.
      XUPER_WEB_PASSWORD: ${XUPER_WEB_PASSWORD:-}
      XUPER_SESSION_SECRET: ${XUPER_SESSION_SECRET:-}
      XUPER_PASSWORDLESS: ${XUPER_PASSWORDLESS:-false}
      XUPER_PUBLIC_ACCESS_ACK: ${XUPER_PUBLIC_ACCESS_ACK:-no}
      MEDIA_ALLOWED_HOSTS: ${MEDIA_ALLOWED_HOSTS:-}
      IPTV_COUNTRY: ${IPTV_COUNTRY:-CO}
      IPTV_LANG: ${IPTV_LANG:-spa}
      IPTV_EXCLUDE_NSFW: ${IPTV_EXCLUDE_NSFW:-true}
      M3U_BASE_URL: ${M3U_BASE_URL:-}
      M3U_USERNAME: ${M3U_USERNAME:-}
      M3U_PASSWORD: ${M3U_PASSWORD:-}
      M3U_TYPE: ${M3U_TYPE:-m3u}
      LEGACY_MAGIS_ENABLED: ${LEGACY_MAGIS_ENABLED:-false}
    volumes:
      - xuvidaa-catalog-cache:/app/server/.cache
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
networks:
  xuvidaa-tv-private:
    external: true
    name: xuvidaa-tv-private

volumes:
  xuvidaa-catalog-cache:
